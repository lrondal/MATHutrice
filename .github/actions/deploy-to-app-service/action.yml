# One deploy, whichever the environment: write that environment's settings on
# its App Service app, then have the app run the given image and wait until it
# answers. Every environment deploys through here, so each is deployed the same
# way, only with its own app and its own secrets.
#
# The caller is already logged in to Azure (azure/login), as the GitHub
# Environment it runs in.
name: Deploy to App Service
description: Run one image on one environment's App Service app, with that environment's settings.

inputs:
  image:
    description: The image to run, tagged with the commit it was built from.
    required: true
  resource-group:
    description: The resource group holding the app.
    required: true
  app-name:
    description: The environment's App Service app.
    required: true
  dev-login-key:
    description: The environment's own DEV_LOGIN_KEY.
    required: true
  session-secret:
    description: The environment's own SESSION_SECRET.
    required: true
  llm-api-key:
    description: LLM_API_KEY, the Mistral key.
    required: true
  llm-base-url:
    description: LLM_BASE_URL, the endpoint the app's LLM calls go through.
    required: true
  posthog-project-token:
    description: POSTHOG_PROJECT_TOKEN, the PostHog project's token.
    required: true
  posthog-environment:
    description: POSTHOG_ENVIRONMENT, the environment's name in PostHog.
    required: true

runs:
  using: composite
  steps:
    # An empty secret would be written as an empty setting: without
    # DEV_LOGIN_KEY anyone signs in as anyone, and the app refuses to start
    # without SESSION_SECRET, LLM_API_KEY or LLM_BASE_URL, or with
    # POSTHOG_PROJECT_TOKEN missing while the other PostHog settings are
    # written. Only the names are printed.
    - name: Check this environment's secrets are set
      shell: bash
      env:
        DEV_LOGIN_KEY: ${{ inputs.dev-login-key }}
        SESSION_SECRET: ${{ inputs.session-secret }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        LLM_BASE_URL: ${{ inputs.llm-base-url }}
        POSTHOG_PROJECT_TOKEN: ${{ inputs.posthog-project-token }}
      run: |
        missing=0
        for name in DEV_LOGIN_KEY SESSION_SECRET LLM_API_KEY LLM_BASE_URL POSTHOG_PROJECT_TOKEN; do
          if [ -z "${!name}" ]; then
            echo "Secret $name is not set in this GitHub Environment" >&2
            missing=1
          fi
        done
        exit $missing

    # Written at every deploy, so that the GitHub Environment and this file stay
    # the one place a setting is changed. --output none: the command would
    # otherwise print every setting back, secrets included.
    #
    # - WEBSITES_PORT: uvicorn listens on 8000, not on the 80 App Service expects.
    # - WEBSITES_ENABLE_APP_SERVICE_STORAGE=false: the SQLite file stays on the
    #   container's own disk. /home is a network share on which SQLite cannot
    #   take its locks. The tables are created and seeded again at every start.
    # - AUTH_MODE=dev: these environments hold generated data and no real users;
    #   the dev sign-in is guarded by the environment's own DEV_LOGIN_KEY, and
    #   its cookie by the environment's own SESSION_SECRET.
    # - POSTHOG_*: errors and logs go to the PostHog project in the EU region,
    #   tagged with the environment's name.
    - name: Write this environment's settings
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        DEV_LOGIN_KEY: ${{ inputs.dev-login-key }}
        SESSION_SECRET: ${{ inputs.session-secret }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        LLM_BASE_URL: ${{ inputs.llm-base-url }}
        POSTHOG_PROJECT_TOKEN: ${{ inputs.posthog-project-token }}
        POSTHOG_ENVIRONMENT: ${{ inputs.posthog-environment }}
      run: |
        az webapp config appsettings set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --settings \
            WEBSITES_PORT=8000 \
            WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
            AUTH_MODE=dev \
            DATABASE_URL=sqlite:///./mathutrice.db \
            "LLM_BASE_URL=$LLM_BASE_URL" \
            LLM_MODEL=ministral-14b-latest \
            "DEV_LOGIN_KEY=$DEV_LOGIN_KEY" \
            "SESSION_SECRET=$SESSION_SECRET" \
            "LLM_API_KEY=$LLM_API_KEY" \
            POSTHOG_HOST=https://eu.i.posthog.com \
            "POSTHOG_PROJECT_TOKEN=$POSTHOG_PROJECT_TOKEN" \
            "POSTHOG_ENVIRONMENT=$POSTHOG_ENVIRONMENT"

    # The image is public on GHCR, so the app pulls it without credentials.
    - name: Run the image
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        az webapp config container set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --container-image-name "$IMAGE"
        running=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query linuxFxVersion --output tsv)
        if [ "$running" != "DOCKER|$IMAGE" ]; then
          echo "$APP_NAME is set to $running, not $IMAGE" >&2
          exit 1
        fi
        echo "$APP_NAME now runs $IMAGE"

    # App Service keeps serving the previous container until the new one has
    # started, or failed to, so a 200 alone may come from the previous image.
    # Wait until the image just set answers: the app sends the commit it was
    # built from in its X-Revision header, and the image's tag is that commit.
    #
    # The limit is the Worked Example's, measured on 8 October 2026 on a B1
    # plan (slowest start 350 s, from "now runs" to its own 200, doubled):
    # 700 s. This job's log prints the time each deploy took, to measure ours.
    - name: Wait until the new image answers
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        url="https://$APP_NAME.azurewebsites.net/dev/login"
        revision="${IMAGE##*:}"
        limit=700
        start=$(date +%s)
        attempt=0
        while true; do
          attempt=$((attempt + 1))
          answer=$(curl -s -o /dev/null -w '%{http_code} %header{x-revision}' --max-time 30 "$url" || true)
          elapsed=$(( $(date +%s) - start ))
          if [ "$answer" = "200 $revision" ]; then
            echo "$url answers 200 from $revision, ${elapsed} s after the image was set"
            exit 0
          fi
          echo "Attempt $attempt, ${elapsed} s: $url answered ${answer:-nothing}, waiting for 200 $revision"
          if [ "$elapsed" -ge "$limit" ]; then
            echo "$url did not answer 200 from $revision within $limit s" >&2
            exit 1
          fi
          sleep 15
        done
